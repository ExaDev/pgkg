name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.pg }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 16 is what docker-compose.yml runs; 17 and 18 build indexes under a
        # restricted search_path, which only a run against them catches (#28).
        pg: [pg16, pg17, pg18]
    env:
      # Testcontainers against the matrix image, never the embedded pgserver
      # build, which is pinned to 16.
      PGKG_TEST_BACKEND: docker
      PGKG_TEST_PG_IMAGE: pgvector/pgvector:${{ matrix.pg }}
      # Extraction runs offline: no test in the suite needs an LLM key.
      PGKG_OFFLINE_EXTRACT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # A handful of tests (the MCP server's) embed for real, with the default
      # BAAI/bge-m3 and reranker; cached so each run does not download them.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-bge-m3-bge-reranker-v2-m3
      - run: uv sync --locked --extra dev --extra mcp
      - run: uv run pytest -q
